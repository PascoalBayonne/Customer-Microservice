spring.datasource.url=jdbc:mysql://localhost:3306/Customer
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop

server.port=8488

#FUNCTION DEFINITION TO BIND THE METHOD THAT PRODUCES EVENT
spring.cloud.function.definition=customerSupplier
#SENDS TO TOPIC
spring.cloud.stream.bindings.customerSupplier-out-0.destination=customer-topic
spring.kafka.producer.properties.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.properties.use.native-encoding=true
#IDEMPOTENCE
spring.cloud.stream.kafka.binder.producer-properties.enable.idempotence=true
spring.cloud.stream.kafka.binder.producer-properties.acks=all
spring.cloud.stream.kafka.binder.producer-properties.max.in.flight.requests.per.connection=1

#DOCKER-COMPOSE-FEATURE
spring.docker.compose.lifecycle-management=start-and-stop




