spring.datasource.url=jdbc:mysql://localhost:3306/Customer
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create

# Optional: Set a fixed port so Prometheus can reliably scrape metrics
# Replace the random port assignment
server.port=8085

#spring.cloud.function.definition=customerSupplier
#
#spring.cloud.stream.bindings.customerSupplier-out-0.destination=customer-topic
#spring.cloud.stream.bindings.publish-out-0.destination=customer-topic

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema/shedlock.sql

spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.externalization.enabled=true
spring.modulith.events.kafka.enable-json=true
spring.modulith.moments.locale=pt
spring.modulith.events.republish-outstanding-events-on-restart=true


management.metrics.data.repository.autotime.enabled=true

# Enable Actuator endpoints - add prometheus endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Enable Prometheus endpoint
management.endpoint.prometheus.enabled=true

# Enable Kafka and web metrics
management.metrics.enable.kafka=true
management.metrics.enable.web=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer


